    function renderPresets() {
        const custom = getCustom();
        
        // Light presets
        const lightContainer = document.getElementById('presets-light');
        if(lightContainer) {
            lightContainer.innerHTML = LIGHT_PRESETS.map(p => `
                <div class="preset-card ${custom.activePreset === p.name && !document.documentElement.getAttribute('data-theme') === 'dark' ? 'active' : ''}" 
                     style="background:linear-gradient(135deg, ${p.bg}, ${p.card})"
                     onclick="applyLightPreset('${p.name}')">
                    <div class="preset-name">${p.name}</div>
                    <span class="preset-badge">${p.badge}</span>
                    <div class="preset-colors">
                        <span class="preset-color-dot" style="background:${p.nav}"></span>
                        <span class="preset-color-dot" style="background:${p.inc}"></span>
                        <span class="preset-color-dot" style="background:${p.exp}"></span>
                        <span class="preset-color-dot" style="background:${p.balFrom}"></span>
                    </div>
                </div>
            `).join('');
        }
        
        // Dark presets
        const darkContainer = document.getElementById('presets-dark');
        if(darkContainer) {
            darkContainer.innerHTML = DARK_PRESETS.map(p => `
                <div class="preset-card ${custom.activePreset === p.name && document.documentElement.getAttribute('data-theme') === 'dark' ? 'active' : ''}"
                     style="background:linear-gradient(135deg, ${p.bg}, ${p.card})"
                     onclick="applyDarkPreset('${p.name}')">
                    <div class="preset-name">${p.name}</div>
                    <span class="preset-badge">${p.badge}</span>
                    <div class="preset-colors">
                        <span class="preset-color-dot" style="background:${p.nav}"></span>
                        <span class="preset-color-dot" style="background:${p.inc}"></span>
                        <span class="preset-color-dot" style="background:${p.exp}"></span>
                        <span class="preset-color-dot" style="background:${p.balFrom}"></span>
                    </div>
                </div>
            `).join('');
        }
    }

    function applyLightPreset(name) {
        const preset = LIGHT_PRESETS.find(p => p.name === name);
        if(!preset) return;
        
        applyTheme('light');
        const custom = getCustom();
        
        custom.bgColor = { light: preset.bg, dark: custom.bgColor?.dark || '#0f172a' };
        custom.cardColor = { light: preset.card, dark: custom.cardColor?.dark || '#1e293b' };
        custom.navColor = { light: preset.nav, dark: custom.navColor?.dark || '#020617' };
        custom.incColor = { light: preset.inc, dark: custom.incColor?.dark || '#34d399' };
        custom.expColor = { light: preset.exp, dark: custom.expColor?.dark || '#a78bfa' };
        custom.balanceFrom = preset.balFrom;
        custom.balanceTo = preset.balTo;
        custom.activePreset = name;
        
        users[currentUser].custom = custom;
        saveCustom();
        
        // Update all color pickers
        document.getElementById('custom-bg-light').value = preset.bg;
        document.getElementById('custom-card-light').value = preset.card;
        document.getElementById('custom-nav-light').value = preset.nav;
        document.getElementById('custom-inc-light').value = preset.inc;
        document.getElementById('custom-exp-light').value = preset.exp;
        document.getElementById('custom-balance-from').value = preset.balFrom;
        document.getElementById('custom-balance-to').value = preset.balTo;
        
        document.getElementById('bg-color-val-light').textContent = preset.bg;
        document.getElementById('card-color-val-light').textContent = preset.card;
        document.getElementById('nav-color-val-light').textContent = preset.nav;
        document.getElementById('inc-color-val-light').textContent = preset.inc;
        document.getElementById('exp-color-val-light').textContent = preset.exp;
        
        applyCustomization();
        renderPresets();
        showToast(`🎨 ${name} theme applied!`);
    }

    function applyDarkPreset(name) {
        const preset = DARK_PRESETS.find(p => p.name === name);

        applyTheme('dark');
        const custom = getCustom();
        
        custom.bgColor = { light: custom.bgColor?.light || '#f0f4f8', dark: preset.bg };

    // ---- SETTINGS UI ----

    function switchSettingsTab(tabId) {
        // Update tabs
        document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.settings-tab[onclick*="${tabId}"]`).classList.add('active');
        
        // Update panels
        document.querySelectorAll('.settings-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${tabId}`).classList.add('active');
    }

        if(!currentUser || !users[currentUser]) return;
        const custom = getCustom();

        if(document.getElementById('custom-bg-light')) {

        // Profile
        const settingsPreview = document.getElementById('settings-profile-preview');
        if(settingsPreview) {
            if(custom.profileImage) {
                settingsPreview.src = custom.profileImage;
            } else {
                settingsPreview.src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${custom.avatarSeed || 'Lucky'}`;
            }
        }
        
        // Display name
        const nameInput = document.getElementById('settings-display-name');
        if(nameInput) nameInput.value = document.getElementById('display-name')?.textContent || currentUser;
        
        // Budget
        const limitInput = document.getElementById('set-limit');
        if(limitInput && users[currentUser]) limitInput.value = users[currentUser].budget || '';
        
        // Currency
        const currencySelect = document.getElementById('set-currency');
        if(currencySelect && users[currentUser]) currencySelect.value = users[currentUser].currency || '$';
        
        // Theme buttons
        const theme = custom.theme || 'light';
        const lightBtn = document.getElementById('theme-light-btn');
        const darkBtn = document.getElementById('theme-dark-btn');
        if(lightBtn && darkBtn) {
            if(theme === 'light') {
                lightBtn.className = 'btn-sm-primary';
                darkBtn.className = 'btn-sm-outline';
            } else {
                lightBtn.className = 'btn-sm-outline';
                darkBtn.className = 'btn-sm-primary';
            }
        }
        
        // Render presets
        renderPresets();
        
        // Render avatar suggestions
        renderAvatarSuggestions();

    function renderAvatarSuggestions() {
        const container = document.getElementById('avatar-suggestions');
        if(!container) return;
        
        const seeds = ['Lucky', 'Mittens', 'Buddy', 'Whiskers', 'Shadow', 'Oreo', 'Simba', 'Luna', 'Charlie', 'Max', 'Bella', 'Oliver'];
        const currentSeed = getCustom().avatarSeed || 'Lucky';
        
        container.innerHTML = seeds.map(seed => `
            <div class="avatar-suggestion ${seed === currentSeed ? 'active' : ''}" data-seed="${seed}" onclick="selectAvatarSuggestion('${seed}')">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}" alt="${seed} avatar" loading="lazy">
            </div>
        `).join('');
    }

    async function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const data = users[currentUser];
        const cur = getCurrency();
        
        // Helper to check if we need a new page
        function checkPage(y, needed = 40) {
            if(y + needed > doc.internal.pageSize.height - 20) {
                doc.addPage();
                return 20;
            }
            return y;
        }

        // ---- TITLE PAGE ----
        doc.setFontSize(24);
        doc.setTextColor(37, 99, 235);
        doc.text('Pocket Planner', 14, 20);
        doc.setFontSize(16);
        doc.setTextColor(0, 0, 0);
        doc.text(`Financial Report for ${currentUser}`, 14, 30);
        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text(`Generated: ${new Date().toLocaleDateString()} | Currency: ${cur}`, 14, 38);
        
        // ---- FINANCIAL OVERVIEW ----
        let yPos = 50;
        let inc = 0, exp = 0;
        data.txs.forEach(t => t.type === 'income' ? inc += t.amt : exp += t.amt);
        const balance = inc - exp;
        
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text('Financial Overview', 14, yPos);
        yPos += 10;
        
        doc.setFontSize(11);
        doc.text(`Total Balance: ${formatCurrency(balance)}`, 20, yPos); yPos += 7;
        doc.setTextColor(46, 204, 113);
        doc.text(`Total Income: ${formatCurrency(inc)}`, 20, yPos); yPos += 7;
        doc.setTextColor(220, 38, 38);
        doc.text(`Total Expenses: ${formatCurrency(exp)}`, 20, yPos); yPos += 7;
        doc.setTextColor(0);
        doc.text(`Monthly Budget Limit: ${formatCurrency(data.budget || 5000)}`, 20, yPos); yPos += 7;
        if(data.budget > 0) {
            const pct = Math.min((exp / data.budget) * 100, 100);
            doc.text(`Budget Used: ${pct.toFixed(1)}%`, 20, yPos); yPos += 7;
        }
        
        // ---- TRANSACTIONS ----
        yPos = checkPage(yPos, 50);
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text(`Transactions (${data.txs.length} total)`, 14, yPos);
        yPos += 8;
        
        if(data.txs.length > 0) {
            const rows = data.txs.map(t => [t.date, t.desc, t.type, t.folder ? data.folders.find(f => f.id === t.folder)?.name || '' : '', formatCurrency(t.amt)]);
            doc.autoTable({ 
                head: [['Date', 'Description', 'Type', 'Folder', 'Amount']], 
                body: rows, startY: yPos, headStyles: { fillColor: [0, 0, 0] },
                styles: { fontSize: 8 },
                columnStyles: { 1: { cellWidth: 60 } }
            });
            yPos = doc.lastAutoTable.finalY + 12;
        } else {
            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text('No transactions recorded yet.', 20, yPos);
            yPos += 12;
        }

        // ---- INVESTMENTS ----
        yPos = checkPage(yPos, 50);
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text(`Investments (${(data.investments || []).length} assets)`, 14, yPos);
        yPos += 8;
        
        if((data.investments || []).length > 0) {
            const totalInv = data.investments.reduce((s, i) => s + (i.amount || 0), 0);
            const totalVal = data.investments.reduce((s, i) => s + (i.currentValue || i.value || 0), 0);
            const totalGain = totalVal - totalInv;
            
            doc.setFontSize(10);
            doc.text(`Total Invested: ${formatCurrency(totalInv)} | Current Value: ${formatCurrency(totalVal)} | Gain/Loss: ${formatCurrency(totalGain)}`, 20, yPos);
            yPos += 7;
            
            const investRows = data.investments.map(inv => [
                inv.name, 
                inv.type, 
                formatCurrency(inv.amount || 0), 
                formatCurrency(inv.currentValue || inv.value || 0), 
                formatCurrency((inv.currentValue || inv.value || 0) - (inv.amount || 0)),
                inv.notes || ''
            ]);
            doc.autoTable({
                head: [['Name', 'Type', 'Invested', 'Value', 'Gain/Loss', 'Notes']],
                body: investRows, startY: yPos, headStyles: { fillColor: [37, 99, 235] },
                styles: { fontSize: 8 }
            });
            yPos = doc.lastAutoTable.finalY + 12;
        } else {
            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text('No investments recorded yet.', 20, yPos);
            yPos += 12;
        }

        // ---- FINANCIAL GOALS ----
        yPos = checkPage(yPos, 50);
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text(`Financial Goals (${(data.goals || []).length} goals)`, 14, yPos);
        yPos += 8;
        
        if((data.goals || []).length > 0) {
            const goalRows = data.goals.map(g => [
                g.name, 
                formatCurrency(g.target), 
                formatCurrency(g.saved), 
                ((g.saved / g.target) * 100).toFixed(1) + '%', 
                g.deadline || 'No deadline',
                g.notes || ''
            ]);
            doc.autoTable({
                head: [['Goal', 'Target', 'Saved', 'Progress', 'Deadline', 'Notes']],
                body: goalRows, startY: yPos, headStyles: { fillColor: [255, 215, 0], textColor: [0, 0, 0] },
                styles: { fontSize: 8 }
            });
            yPos = doc.lastAutoTable.finalY + 12;
        } else {
            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text('No goals set yet.', 20, yPos);
            yPos += 12;
        }

        // ---- SUBSCRIPTIONS ----
        yPos = checkPage(yPos, 50);
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text(`Subscriptions (${(data.subscriptions || []).length} services)`, 14, yPos);
        yPos += 8;
        
        if((data.subscriptions || []).length > 0) {
            let monthlyTotal = 0;
            data.subscriptions.forEach(s => {
                const amt = s.amount || 0;
                if(s.billing === 'yearly') monthlyTotal += amt / 12;
                else if(s.billing === 'weekly') monthlyTotal += amt * 4;
                else monthlyTotal += amt;
            });
            
            doc.setFontSize(10);
            doc.text(`Monthly Total: ${formatCurrency(monthlyTotal)} | Yearly Total: ${formatCurrency(monthlyTotal * 12)}`, 20, yPos);
            yPos += 7;
            
            const subRows = data.subscriptions.map(s => [s.name, formatCurrency(s.amount), s.billing, s.category, s.notes || '']);
            doc.autoTable({
                head: [['Service', 'Amount', 'Billing', 'Category', 'Notes']],
                body: subRows, startY: yPos, headStyles: { fillColor: [255, 107, 107] },
                styles: { fontSize: 8 }
            });
            yPos = doc.lastAutoTable.finalY + 12;
        } else {
            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text('No subscriptions recorded yet.', 20, yPos);
            yPos += 12;
        }

        // ---- LOAN EMIs ----
        yPos = checkPage(yPos, 50);
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text(`Loan EMIs (${(data.emis || []).length} loans)`, 14, yPos);
        yPos += 8;
        
        if((data.emis || []).length > 0) {
            const totalEmi = data.emis.reduce((s, e) => s + (e.amount || 0), 0);
            const totalLoan = data.emis.reduce((s, e) => s + (e.totalAmount || 0), 0);
            const totalPaid = data.emis.reduce((s, e) => s + (e.paid || 0) * (e.amount || 0), 0);
            
            doc.setFontSize(10);
            doc.text(`Total Monthly EMI: ${formatCurrency(totalEmi)} | Total Loan Amount: ${formatCurrency(totalLoan)}`, 20, yPos);
            yPos += 7;
            
            const emiRows = data.emis.map(e => [
                e.name,
                formatCurrency(e.amount || 0),
                formatCurrency(e.totalAmount || 0),
                (e.tenure || 0) + ' mo',
                (e.paid || 0) + ' / ' + (e.tenure || 0),
                e.notes || ''
            ]);
            doc.autoTable({
                head: [['Loan', 'Monthly', 'Total', 'Tenure', 'Paid', 'Notes']],
                body: emiRows, startY: yPos, headStyles: { fillColor: [255, 140, 0] },
                styles: { fontSize: 8 }
            });
            yPos = doc.lastAutoTable.finalY + 12;
        } else {
            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text('No loans/EMIs recorded yet.', 20, yPos);
            yPos += 12;
        }

        // ---- BANK ACCOUNTS ----
        yPos = checkPage(yPos, 50);
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text(`Bank Accounts (${(data.banks || []).length} accounts)`, 14, yPos);
        yPos += 8;
        
        if((data.banks || []).length > 0) {
            const totalBal = data.banks.reduce((s, b) => s + (b.balance || 0), 0);
            doc.setFontSize(10);
            doc.text(`Total Balance Across Accounts: ${formatCurrency(totalBal)}`, 20, yPos);
            yPos += 7;
            
            const bankRows = data.banks.map(b => [
                b.name,
                b.holder || 'Main',
                b.type,
                formatCurrency(b.balance || 0),
                b.notes || ''
            ]);
            doc.autoTable({
                head: [['Bank', 'Holder', 'Type', 'Balance', 'Notes']],
                body: bankRows, startY: yPos, headStyles: { fillColor: [74, 144, 217] },
                styles: { fontSize: 8 }
            });
            yPos = doc.lastAutoTable.finalY + 12;
        } else {
            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text('No bank accounts recorded yet.', 20, yPos);
            yPos += 12;
        }

        // ---- FOLDERS ----
        yPos = checkPage(yPos, 50);
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text(`Folders (${(data.folders || []).length} folders)`, 14, yPos);
        yPos += 8;
        
        if((data.folders || []).length > 0) {
            const folderRows = data.folders.map(f => {
                const txCount = data.txs.filter(t => t.folder === f.id).length;
                const folderExp = data.txs.filter(t => t.folder === f.id && t.type === 'expense').reduce((s, t) => s + t.amt, 0);
                const folderInc = data.txs.filter(t => t.folder === f.id && t.type === 'income').reduce((s, t) => s + t.amt, 0);
                return [f.name, f.type || 'personal', txCount + ' txns', formatCurrency(folderExp), formatCurrency(folderInc)];
            });
            doc.autoTable({
                head: [['Folder', 'Type', 'Transactions', 'Spent', 'Earned']],
                body: folderRows, startY: yPos, headStyles: { fillColor: [139, 92, 246] },
                styles: { fontSize: 8 }
            });
            yPos = doc.lastAutoTable.finalY + 12;
        } else {
            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text('No folders created yet.', 20, yPos);
            yPos += 12;
        }

        // ---- MONTHLY BREAKDOWN (last 6 months) ----
        yPos = checkPage(yPos, 60);
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text('Monthly Breakdown (Last 6 Months)', 14, yPos);
        yPos += 8;
        
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const now = new Date();
        const monthData = [];
        for(let m = 0; m < 6; m++) {
            const d = new Date(now.getFullYear(), now.getMonth() - m, 1);
            const monthTxs = data.txs.filter(t => {
                const parts = t.date.split('/');
                if(parts.length !== 3) return false;
                const txMonth = parseInt(parts[0]) - 1;
                const txYear = parseInt(parts[2]);
                return txMonth === d.getMonth() && txYear === d.getFullYear();
            });
            const mInc = monthTxs.filter(t => t.type === 'income').reduce((s, t) => s + t.amt, 0);
            const mExp = monthTxs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amt, 0);
            monthData.push([
                monthNames[d.getMonth()] + ' ' + d.getFullYear(),
                formatCurrency(mInc),
                formatCurrency(mExp),
                formatCurrency(mInc - mExp)
            ]);
        }
        doc.autoTable({
            head: [['Month', 'Income', 'Expenses', 'Net']],
            body: monthData, startY: yPos, headStyles: { fillColor: [0, 0, 0] },
            styles: { fontSize: 8 }
        });
        yPos = doc.lastAutoTable.finalY + 12;

        // ---- FOOTER ----
        yPos = checkPage(yPos, 20);
        doc.setFontSize(9);
        doc.setTextColor(150);
        doc.text('Generated by Pocket Planner Pro', 14, yPos);
        doc.text('Page ' + doc.internal.getNumberOfPages(), doc.internal.pageSize.width - 30, yPos);

        doc.save('PocketPlanner_Report.pdf');
    }

    // Avatar upload
    document.getElementById('file-input').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = function() {
            users[currentUser].avatar = reader.result;
            document.getElementById('user-img').src = reader.result;
            document.getElementById('user-img').dataset.custom = 'true';
            // Also save to new customization system
            if(users[currentUser].custom) {
                users[currentUser].custom.profileImage = reader.result;
            }
            save();
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // Initialize folder selector when home view loads
    const observer = new MutationObserver(() => {
        if(document.getElementById('view-home').classList.contains('active')) {
            updateFolderSelector();
        }
    });
    observer.observe(document.getElementById('view-home'), { attributes: true, attributeFilter: ['class'] });

    // ---- Init ----
    window.addEventListener('DOMContentLoaded', () => {
        if(currentUser && users[currentUser]) startApp();
    });
</script>
</body>
</html>
